# Continuous integration for the API. Railway deploys `main` on its own
# (GitHub autodeploy); with "Wait for CI" enabled on the Railway service, a
# deployment only starts once this workflow has passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pull-request runs are cancelled; pushes to main queue instead, so
# every main commit gets a real pass/fail for Railway's "Wait for CI" to act on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  e2e:
    name: API e2e against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valle_park
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valle_park"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: valle_park
      DB_SSL: "false"
      TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same bootstrap Railway runs before every deploy: schema + seed.
      - name: Load schema and seed
        run: node scripts/db-init.js
      - run: npm run test:e2e -- --ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: valle-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment fallback. Railway's GitHub integration (preferred)
  # deploys main on its own once the Railway GitHub App has access to this
  # repository. Until then, or instead, a RAILWAY_TOKEN repository secret
  # (a Railway project token) makes this job upload and deploy the checked-out
  # commit after every check above has passed. Never enable both, or each push
  # deploys twice. See DEPLOYMENT.md in valle-web-backend.
  deploy:
    name: Deploy to Railway (only when RAILWAY_TOKEN is set)
    needs: [test, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN is not set, skipping (Railway's GitHub autodeploy handles deploys)."
      - if: env.RAILWAY_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli
      # Tag the build with the commit so Sentry groups issues by release and can
      # tell which deploy introduced a regression (crash-free sessions need it too).
      - if: env.RAILWAY_TOKEN != ''
        run: railway variables --service api --skip-deploys --set "SENTRY_RELEASE=${{ github.sha }}"
      - if: env.RAILWAY_TOKEN != ''
        run: railway up --service api --ci --message "GitHub Actions ${{ github.sha }}"
